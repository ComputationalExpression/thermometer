# Sixteen checks. Each class is checked on its own: the checks give your class a pretend board
# and pretend sensors, so a check passes or fails on its own file whatever state the
# others are in. The program checks run all four classes together with the provided main.py and
# read only the thermometer log. Time passes only when your code calls sleep.
# Pull main before you run the checks, so you have each teammate's merged work.

- description: "[SENSORS] Sensors(air_pin) makes ADC(4) and a DHT22 on the pin, with air_celsius, humidity and readings at 0; read_air() calls measure(), keeps the temperature and humidity, and adds 1 to readings"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_sensors_start_and_measure_the_air

- description: "[SENSORS] air_fahrenheit() converts air_celsius, chip_fahrenheit() converts a read_u16() reading with the formulas in the README, and difference() is the chip minus the air"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_sensors_convert_and_compare

- description: "[COMFORT] Comfort stores its four dividing values; level() returns cold, warm or hot, and humidity_level() returns dry, comfortable or humid"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_comfort_sorts_a_temperature_and_a_humidity

- description: "[COMFORT] is_comfortable() is True only for warm and comfortable, and describe() returns both values rounded to one decimal place, with both levels"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_comfort_describes_a_reading

- description: "[DISPLAY] Display(hot_pin, warm_pin, cold_pin) keeps its Pins in a dictionary with the keys hot, warm and cold, starts with showing as off, and all_off() turns them off"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_display_starts_dark_with_its_lights_in_a_dictionary

- description: "[DISPLAY] show(level) lights only that level's LED; flash(level) shows it for half a second, then turns it off; test_lights() lights all three for one second"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_display_shows_flashes_and_tests_its_lights

- description: "[LOG] Log(place) stores place, empty temperatures and humidities lists, and counts of 0 for cold, warm and hot; record() adds to the three"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_log_records_readings

- description: "[LOG] highest(), lowest() and average_humidity() loop over their list; start highest and lowest from the first temperature, not from 0"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_log_finds_the_highest_lowest_and_average_humidity

- description: "[PROGRAM] The provided main.py runs with all four classes, flashes the LED when the humidity is not comfortable, and logs the readings, with the LEDs off at the end"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_program_reads_both_sensors_and_logs_them

- description: "[PROGRAM] A press of the button stops the readings early, and the log counts only the readings taken"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_thermometer.py::test_the_program_stops_when_the_button_is_pressed

- description: "[GIT] At least four pull requests are merged with Merge pull request, one for each class file"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_pull_requests_were_merged

- description: "[GIT] The files in src have commits from at least two teammates"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_teammates_each_committed_to_src

- description: "[CODE] No TODO markers remain in any file in src: delete each one once its code is written, including Author"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_no_file_has_a_todo

- description: "[CODE] Each file in src has a docstring for its class and each method, and at least two comments: say why, not what the line already says"
  check: ExecuteCommand
  options:
    command: uv run pytest tests/test_structure.py::test_each_file_has_docstrings_and_two_comments

- docs/summary.md:
  - description: "[SUMMARY] No TODO markers remain in docs/summary.md: replace each one with your answer, then delete it"
    check: MatchFileFragment
    options:
      fragment: TODO
      count: 0
      exact: true
  - description: "[SUMMARY] At least 250 words in docs/summary.md: each teammate answers the question for their own file, and the team answers the last one together"
    check: CountFileWords
    options:
      count: 250
      exact: false
